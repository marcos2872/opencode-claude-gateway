# opencode-claude-gateway — full example.
#
# This is a showcase, not the recommended starting point: the first run seeds
# ~/.config/opencode-claude-gateway/config.toml with every key commented
# (built-in defaults). Copy only the blocks you need.
#
# Model refs/aliases below are examples from the OpenCode catalog; list the
# current ones with `ocg --refresh` or `curl -s http://127.0.0.1:3737/v1/models`.
# They age: a ref that no longer exists makes its alias fail silently (the
# request falls back to the catalog's plain-id match), so re-check before
# copying.

# ── basics ────────────────────────────────────────────────────────────────
port = 3737

# Gateway credential Claude Code sends (ANTHROPIC_AUTH_TOKEN / x-api-key).
# Empty = accept any on loopback. When set, everything except /health needs it.
auth_token = ""

# Used when the request omits "model". Empty = first alias alphabetically.
# Tip: pick a real chat model, not a Copilot/fast row. Keep it on one of the
# models the [aliases] block below pins to, or stray no-model calls land on a
# fourth provider you did not choose.
default_model = "claude-opencode-go-deepseek-v4-1-flash"

# ── OpenCode v2 connection ────────────────────────────────────────────────
# Binary used for pairing, catalog and db-path discovery.
opencode_bin = "opencode"

# Pair with the selected service and read catalog/providers/credentials over
# HTTP. false = offline fallback (CLI + SQLite credential table).
opencode_pair = true

# Explicit v2 server URL. Empty = discover from the selected service.
opencode_url = ""

# ── catalog visibility ────────────────────────────────────────────────────
# Console free-tier opencode/* models 403 outside OpenCode; hidden by default.
include_free_tier = false

# Claude Desktop only: rewrite advertised ids around its third-party denylist.
# Claude Code lists every claude-* id already; leave false unless you use Desktop.
desktop_aliases = false

# Claude Code CLI: rewrite family spelling (claude-sonnet -> cs, claude-opus -> co)
# so background calls don't land on the Copilot rows. Recommended on.
cli_shield_aliases = true

# Answer Claude Code's auto-mode classifier and liveness probes locally.
# Tradeoff: auto mode's LLM safety review always says "allow". Off by default.
# Note: the classifier sends first-party ids (claude-sonnet-5, claude-opus-4-8);
# with the [aliases] block below those resolve to your pinned models, so every
# auto-mode check spends their quota. Turn this on to keep them off the wire.
mock_classifier = false

# ── transport ─────────────────────────────────────────────────────────────
# connect fails fast on an unreachable provider; request bounds the whole call,
# streaming included, so it is generous by design.
connect_timeout_secs = 30
request_timeout_secs = 3600

# ── optional: Anthropic family tiers (Claude Desktop background calls) ─────
# Key = gateway id or provider/model ref (prefer the ref). Valid tiers:
# haiku | sonnet | opus | fable | mythos. The Desktop's small_fast class picks
# the first haiku, then sonnet, then opus. The Claude Code CLI ignores tiers.
[tiers]
# [tiers."opencode-go/muse-spark-1.3-contributor"]
# tier = "haiku"
# family_default = true
#
# [tiers."opencode-go/deepseek-v4.1-flash"]
# tier = "sonnet"
# family_default = true

# ── optional: manual aliases ──────────────────────────────────────────────
# Automatic aliases already cover every catalog row as
# claude-<provider>-<model>. Use [aliases] to override a name, or to pin the
# first-party ids Claude Code sends on its own.
#
# Why pin them: side queries, small_fast, the auto-mode classifier and family
# fallbacks send hardcoded ids (claude-sonnet-5, claude-opus-4-8,
# claude-haiku-4-5, ...). Those never consult default_model or [tiers] — they
# hit the catalog's plain-id match, which picks the first row sorted by
# provider/model. That means github-copilot/* (with a "ambiguous model id"
# warning) or the free-tier opencode/* rows (403 outside OpenCode). A manual
# alias wins over that match, so each id below is pinned to one of three
# models you actually want:
#
#   haiku*  -> opencode-go/muse-spark-1.3-contributor  (cheap/background)
#   sonnet* -> github-copilot/gpt-6-luna               (workhorse)
#   opus*   -> opencode-go/deepseek-v4.1-flash
#   fable*  -> opencode-go/deepseek-v4.1-flash
#
# Rules that make this work:
#   - `opencode` must be the catalog's exact modelID (`glm-5.3-flash`, with a
#     dot — not the alias slug). A wrong ref still shows up on /v1/models but
#     resolves back to the plain-id match, silently.
#   - cover every family id: a new CLI release sending an unlisted id brings
#     the inference back.
#   - refs age: `ocg --refresh` lists the current catalog.
#
# Check where a request actually went (the `upstream ok` line logs the id the
# client asked for, not the destination):
#   RUST_LOG=opencode_claude_gateway=debug ocg --serve
#   # then look for "upstream cache usage ... opencode_ref=<destination>"

# --- haiku (small_fast, titles, background calls) -> muse-spark ------------
[aliases."claude-haiku-4-5"]
opencode = "opencode-go/muse-spark-1.3-contributor"
display_name = "Haiku 4.5 -> Muse Spark 1.3"
description = "via ocg · opencode-go/muse-spark-1.3-contributor"

[aliases."claude-haiku-5-5"]
opencode = "opencode-go/muse-spark-1.3-contributor"
display_name = "Haiku 5.5 -> Muse Spark 1.3"

# --- sonnet -> github-copilot/gpt-6-luna -----------------------------------
[aliases."claude-sonnet-4-5"]
opencode = "github-copilot/gpt-6-luna"
display_name = "Sonnet 4.5 -> GPT-6 Luna"

[aliases."claude-sonnet-4-6"]
opencode = "github-copilot/gpt-6-luna"
display_name = "Sonnet 4.6 -> GPT-6 Luna"

[aliases."claude-sonnet-5"]
opencode = "github-copilot/gpt-6-luna"
display_name = "Sonnet 5 -> GPT-6 Luna"

[aliases."claude-sonnet-5-5"]
opencode = "github-copilot/gpt-6-luna"
display_name = "Sonnet 5.5 -> GPT-6 Luna"

# --- opus -> opencode-go/deepseek-v4.1-flash -------------------------------
[aliases."claude-opus-4-5"]
opencode = "opencode-go/deepseek-v4.1-flash"
display_name = "Opus 4.5 -> DeepSeek V4.1 Flash"

[aliases."claude-opus-4-6"]
opencode = "opencode-go/deepseek-v4.1-flash"
display_name = "Opus 4.6 -> DeepSeek V4.1 Flash"

[aliases."claude-opus-4-7"]
opencode = "opencode-go/deepseek-v4.1-flash"
display_name = "Opus 4.7 -> DeepSeek V4.1 Flash"

[aliases."claude-opus-4-8"]
opencode = "opencode-go/deepseek-v4.1-flash"
display_name = "Opus 4.8 -> DeepSeek V4.1 Flash"

[aliases."claude-opus-5"]
opencode = "opencode-go/deepseek-v4.1-flash"
display_name = "Opus 5 -> DeepSeek V4.1 Flash"

[aliases."claude-opus-5-5"]
opencode = "opencode-go/deepseek-v4.1-flash"
display_name = "Opus 5.5 -> DeepSeek V4.1 Flash"

# --- fable -> opencode-go/deepseek-v4.1-flash ------------------------------
[aliases."claude-fable-5"]
opencode = "opencode-go/deepseek-v4.1-flash"
display_name = "Fable 5 -> DeepSeek V4.1 Flash"

[aliases."claude-fable-5-1"]
opencode = "opencode-go/deepseek-v4.1-flash"
display_name = "Fable 5.1 -> DeepSeek V4.1 Flash"

[aliases."claude-fable-5-2"]
opencode = "opencode-go/deepseek-v4.1-flash"
display_name = "Fable 5.2 -> DeepSeek V4.1 Flash"

# --- canonical names for the three pinned models ---------------------------
# A manual alias consumes its ref (`used_refs`, src/api/state.rs:163), which
# drops the automatic claude-opencode-go-<model> alias for that row from
# /v1/models. Re-declare the canonical id here to keep both. Keep this list in
# sync with the destinations above.
[aliases."claude-opencode-go-deepseek-v4-1-flash"]
opencode = "opencode-go/deepseek-v4.1-flash"

[aliases."claude-opencode-go-muse-spark-1-3-contributor"]
opencode = "opencode-go/muse-spark-1.3-contributor"

[aliases."claude-github-copilot-gpt-6-luna"]
opencode = "github-copilot/gpt-6-luna"


# ── optional: hide rows from /v1/models ───────────────────────────────────
[disabled]
models = [
  # "opencode-go/hy4-preview",
]
