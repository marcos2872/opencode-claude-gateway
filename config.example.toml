# opencode-claude-gateway — full example.
#
# This is a showcase, not the recommended starting point: the first run seeds
# ~/.config/opencode-claude-gateway/config.toml with every key commented
# (built-in defaults). Copy only the blocks you need.
#
# Model refs/aliases below are examples from the OpenCode catalog; list the
# current ones with `ocg --refresh` or `curl -s http://127.0.0.1:3737/v1/models`.

# ── basics ────────────────────────────────────────────────────────────────
port = 3737

# Gateway credential Claude Code sends (ANTHROPIC_AUTH_TOKEN / x-api-key).
# Empty = accept any on loopback. When set, everything except /health needs it.
auth_token = ""

# Used when the request omits "model". Empty = first alias alphabetically.
# Tip: pick a real chat model, not a Copilot/fast row.
default_model = "claude-opencode-go-kimi-k2-7-code"

# ── OpenCode v2 connection ────────────────────────────────────────────────
# Binary used for pairing, catalog and db-path discovery.
opencode_bin = "opencode"

# Pair with the selected service and read catalog/providers/credentials over
# HTTP. false = offline fallback (CLI + SQLite credential table).
opencode_pair = true

# Explicit v2 server URL. Empty = discover from the selected service.
opencode_url = ""

# ── catalog visibility ────────────────────────────────────────────────────
# Console free-tier opencode/* models 403 outside OpenCode; hidden by default.
include_free_tier = false

# Claude Desktop only: rewrite advertised ids around its third-party denylist.
# Claude Code lists every claude-* id already; leave false unless you use Desktop.
desktop_aliases = false

# Claude Code CLI: rewrite family spelling (claude-sonnet -> cs, claude-opus -> co)
# so background calls don't land on the Copilot rows. Recommended on.
cli_shield_aliases = true

# Answer Claude Code's auto-mode classifier and liveness probes locally.
# Tradeoff: auto mode's LLM safety review always says "allow". Off by default.
mock_classifier = false

# ── transport ─────────────────────────────────────────────────────────────
# connect fails fast on an unreachable provider; request bounds the whole call,
# streaming included, so it is generous by design.
connect_timeout_secs = 30
request_timeout_secs = 3600

# ── optional: Anthropic family tiers (Claude Desktop background calls) ─────
# Key = gateway id or provider/model ref (prefer the ref). Valid tiers:
# haiku | sonnet | opus | fable | mythos. The Desktop's small_fast class picks
# the first haiku, then sonnet, then opus. The Claude Code CLI ignores tiers.
[tiers]
# [tiers."opencode-go/muse-spark-1.3-contributor"]
# tier = "haiku"
# family_default = true
#
# [tiers."opencode-go/deepseek-v4.1-flash"]
# tier = "sonnet"
# family_default = true

# ── optional: manual aliases ──────────────────────────────────────────────
# Automatic aliases already cover every catalog row as
# claude-<provider>-<model>. Use [aliases] only to override a name.
[aliases]
# [aliases."claude-my-model"]
# opencode = "opencode-go/kimi-k2.7-code"
# display_name = "Kimi (Go)"
# description = "via ocg · opencode-go/kimi-k2.7-code"

# ── optional: hide rows from /v1/models ───────────────────────────────────
[disabled]
models = [
  # "opencode-go/hy4-preview",
]
