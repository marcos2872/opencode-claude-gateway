name: ci

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# Cancel superseded runs on the same ref (a new push wins).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # Publica o resumo do job `test` como comentário na PR.
  pull-requests: write

env:
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-D warnings"

jobs:
  # Job name is the required status check enforced by branch protection.
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Steps com continue-on-error: todos rodam mesmo quando um falha, para
      # que o resumo (painel + comentário na PR) saia completo. A falha real é
      # propagada no step "Propagar falha" lá embaixo — sem ele o job ficaria
      # verde com tests vermelhos.
      - name: Check formatting
        id: fmt
        continue-on-error: true
        run: cargo fmt --all --check

      - name: Clippy (deny warnings)
        id: clippy
        continue-on-error: true
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Run full test suite
        id: tests
        continue-on-error: true
        # `set -o pipefail` so a failing `cargo test` is not masked by the
        # `tee` exit status; the output file feeds the job summary below.
        run: |
          set -o pipefail
          cargo test --locked --all-targets 2>&1 | tee /tmp/test-output.txt

      - name: Job summary (painel + comentário na PR)
        # `always()` para o resumo sair mesmo quando algo falha.
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          FMT: ${{ steps.fmt.outcome }}
          CLIPPY: ${{ steps.clippy.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          # Vazio em push (sem PR) — o comentário só sai quando existir PR.
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          status() {
            case "$1" in
              success) echo "✅ pass" ;;
              failure) echo "❌ fail" ;;
              skipped) echo "⏭️ skipped" ;;
              cancelled) echo "🚫 cancelled" ;;
              *) echo "⏭️ ${1:-unknown}" ;;
            esac
          }
          summary=$(mktemp)
          {
            echo "## Resumo do CI — \`test\`"
            echo ""
            echo "\`${REF}\` @ \`${SHA:0:7}\`"
            echo ""
            echo "| Etapa | Resultado |"
            echo "| --- | --- |"
            echo "| Formatação (\`cargo fmt\`) | $(status "$FMT") |"
            echo "| Clippy (\`-D warnings\`) | $(status "$CLIPPY") |"
            echo "| Suíte de testes | $(status "$TESTS") |"
            echo ""
            if [ -f /tmp/test-output.txt ]; then
              read -r passed failed ignored < <(awk '/^test result:/ {
                for (i = 1; i <= NF; i++) {
                  if ($(i + 1) == "passed;") p += $i
                  if ($(i + 1) == "failed;") f += $i
                  if ($(i + 1) == "ignored;") g += $i
                }
              } END { printf "%d %d %d\n", p, f, g }' /tmp/test-output.txt)
              echo "**Testes:** ${passed:-0} passaram · ${failed:-0} falharam · ${ignored:-0} ignorados"
            fi
            echo ""
          } > "$summary"
          cat "$summary" >> "$GITHUB_STEP_SUMMARY"

          # Em PR, publica o resumo como comentário sticky (script
          # compartilhado com o job perf; no-op em push, warning em fork).
          bash .github/scripts/pr-sticky-comment.sh '<!-- ocg-ci-summary -->' "$summary"

      # Só aqui o job falha — os steps acima rodam com continue-on-error para
      # que o resumo sempre seja publicado (e fmt/clippy/testes todos executem).
      - name: Propagar falha
        if: ${{ steps.fmt.outcome == 'failure' || steps.clippy.outcome == 'failure' || steps.tests.outcome == 'failure' }}
        run: exit 1

  # Separate, blocking perf gate. The perf tests also run (report-only) inside
  # `test`; here the release profile enforces the p95 budget. `--test-threads=1`
  # keeps the two scenarios from contending for CPU and inflating each other's
  # tail latency. To actually block merges, add `perf` to the branch
  # protection required status checks (like `test`).
  perf:
    name: perf
    runs-on: ubuntu-latest
    needs: test
    env:
      OCG_PERF_P95_MS: "15"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Proxy translation latency (p95 < 15ms, release)
        id: perf
        # `set -o pipefail` so a failed budget assertion is not masked by `tee`.
        run: |
          set -o pipefail
          cargo test --release --locked --test perf -- --nocapture --test-threads=1 2>&1 | tee /tmp/perf-output.txt

      - name: Job summary (painel + comentário na PR)
        # `always()` para o resumo sair mesmo quando o gate falha.
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PERF: ${{ steps.perf.outcome }}
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          # Vazio em push (sem PR) — o comentário só sai quando existir PR.
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          summary=$(mktemp)
          {
            echo "## Resumo do CI — \`perf\`"
            echo ""
            echo "\`${REF}\` @ \`${SHA:0:7}\` — orçamento **p95 < ${OCG_PERF_P95_MS}ms** (release)"
            echo ""
            echo "| Cenário | n | p50 | p95 | mean | min | max |"
            echo "| --- | --: | --: | --: | --: | --: | --: |"
            if [ -f /tmp/perf-output.txt ]; then
              # The harness prints on stderr, interleaved with libtest's
              # `test <name> ... ` progress, so extract the [perf] record with
              # -oE instead of anchoring to the line start.
              grep -oE '\[perf\] [a-z_]+: n=[0-9]+ warmup=[0-9]+ p50=[0-9.]+ms p95=[0-9.]+ms mean=[0-9.]+ms min=[0-9.]+ms max=[0-9.]+ms' /tmp/perf-output.txt \
                | awk -F'[ =]+' '{ label = $2; sub(/:$/, "", label);
                    printf "| %s | %s | %s | %s | %s | %s | %s |\n",
                           label, $4, $8, $10, $12, $14, $16 }'
            fi
            echo ""
            case "$PERF" in
              success) echo "**Veredito:** ✅ p95 dentro do orçamento" ;;
              failure) echo "**Veredito:** ❌ p95 acima do orçamento (ou testes falharam)" ;;
              *) echo "**Veredito:** ⏭️ ${PERF:-unknown}" ;;
            esac
          } > "$summary"
          cat "$summary" >> "$GITHUB_STEP_SUMMARY"
          # Em PR, publica como comentário sticky (marcador próprio: convive
          # com o do job test na mesma PR).
          bash .github/scripts/pr-sticky-comment.sh '<!-- ocg-ci-perf-summary -->' "$summary"

  # Coverage informativo (não bloqueia o merge). Mesmo escopo do job `test`
  # com instrumentação llvm-cov; publica o TOTAL + arquivos de menor cobertura
  # no resumo e como comentário sticky na PR (marcador próprio).
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Coverage (report-only)
        id: cov
        continue-on-error: true
        # `set -o pipefail` para que um `cargo llvm-cov` com testes falhando
        # não seja mascarado pelo `tee`.
        run: |
          set -o pipefail
          cargo llvm-cov --locked --all-targets --summary-only 2>&1 | tee /tmp/cov-output.txt
          cargo llvm-cov --locked --all-targets --lcov --output-path /tmp/lcov.info >/dev/null 2>&1 || true

      - name: Job summary (painel + comentário na PR)
        # `always()` para o resumo sair mesmo quando a medição falha.
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          COV: ${{ steps.cov.outcome }}
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          summary=$(mktemp)
          {
            echo "## Resumo do CI — \`coverage\`"
            echo ""
            echo "\`${REF}\` @ \`${SHA:0:7}\` — \`cargo llvm-cov --locked --all-targets\` (report-only)"
            echo ""
            if [ -f /tmp/cov-output.txt ]; then
              total=$(grep -E '^TOTAL' /tmp/cov-output.txt || true)
              if [ -n "$total" ]; then
                echo "| Métrica | Cobertura |"
                echo "| --- | --: |"
                echo "| Regiões | $(echo "$total" | awk '{print $4}') |"
                echo "| Funções | $(echo "$total" | awk '{print $7}') |"
                echo "| Linhas | $(echo "$total" | awk '{print $10}') |"
                echo ""
                echo "<details><summary>Arquivos com menor cobertura de linhas</summary>"
                echo ""
                echo "| Arquivo | Linhas |"
                echo "| --- | --: |"
                grep -E '\.rs +[0-9]+ +[0-9]+ +[0-9.]+%' /tmp/cov-output.txt \
                  | awk '{print "| " $1 " | " $10 " |"}' | sort -t'|' -k3 -n | head -n 10
                echo ""
                echo "</details>"
              else
                echo "_Sem linha TOTAL no output (medição falhou antes do relatório)._"
                echo ""
              fi
            fi
            case "$COV" in
              success) echo "**Veredito:** ✅ medição concluída" ;;
              failure) echo "**Veredito:** ❌ medição falhou (ver logs)" ;;
              *) echo "**Veredito:** ⏭️ ${COV:-unknown}" ;;
            esac
          } > "$summary"
          cat "$summary" >> "$GITHUB_STEP_SUMMARY"
          # Em PR, publica como comentário sticky (marcador próprio: convive
          # com os dos jobs test e perf na mesma PR).
          bash .github/scripts/pr-sticky-comment.sh '<!-- ocg-ci-cov-summary -->' "$summary"

      - name: Upload lcov.info
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lcov-info
          path: /tmp/lcov.info
          if-no-files-found: ignore
